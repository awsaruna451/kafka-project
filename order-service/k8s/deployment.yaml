apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: kafka
spec:
  replicas: 3                      # keep <= partition count (6)
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: app
          image: <your-ecr-repo>/order-service:1.0.0
          ports: [{ containerPort: 8080 }]
          env:
            - { name: KAFKA_BOOTSTRAP, value: "prod-kafka-kafka-bootstrap.kafka.svc:9093" }
            - { name: KAFKA_USER, value: "order-service" }
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef: { name: order-service, key: password }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
          volumeMounts:
            - { name: kafka-ca, mountPath: /certs, readOnly: true }
      volumes:
        - name: kafka-ca
          secret:
            secretName: prod-kafka-cluster-ca-cert
            items:
              - { key: ca.crt, path: ca.crt }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: kafka
spec:
  selector: { app: order-service }
  ports: [{ port: 80, targetPort: 8080 }]
