apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: orders
  namespace: kafka
  labels: { strimzi.io/cluster: prod-kafka }
spec:
  partitions: 3
  replicas: 1
  config: { retention.ms: 604800000, min.insync.replicas: 2 }
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: order-service
  namespace: kafka
  labels: { strimzi.io/cluster: prod-kafka }
spec:
  authentication: { type: scram-sha-512 }
  authorization:
    type: simple
    acls:
      - { resource: { type: topic, name: orders },           operations: [Read, Write, Describe] }
      - { resource: { type: topic, name: orders-processed }, operations: [Read, Write, Describe] }
      - { resource: { type: topic, name: orders.DLT },       operations: [Read, Write, Describe] }   # Read added
      - { resource: { type: group, name: order-service },    operations: [Read] }
      - { resource: { type: group, name: txn-order, patternType: prefix },   operations: [Read] }
      - { resource: { type: group, name: order-service-dlt },                operations: [Read] }   # exact name
      - { resource: { type: transactionalId, name: order-tx-, patternType: prefix }, operations: [Describe, Write] }
      - { resource: { type: topic, name: order.commands },        operations: [Read, Write, Describe ] }
      - { resource: { type: topic, name: payment.commands },      operations: [ Read,Write, Describe ] }
      - { resource: { type: topic, name: notification.commands }, operations: [ Read,Write, Describe ] }
        # consumes replies
      - { resource: { type: topic, name: order.replies },         operations: [ Write,Read, Describe ] }
      - { resource: { type: topic, name: payment.replies },       operations: [ Write,Read, Describe ] }
        # dead-letter topics for replies it fails to process
      - { resource: { type: topic, name: order.replies.DLT },     operations: [ Write, Describe ] }
      - { resource: { type: topic, name: payment.replies.DLT },   operations: [ Write, Describe ] }
      - { resource: { type: group, name: orchestrator-service },  operations: [ Read ] }
      - { resource: { type: group, name: notification-service },  operations: [ Read ] }
      - { resource: { type: group, name: payment-service },  operations: [ Read ] }
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: orders-dlt
  namespace: kafka
  labels: { strimzi.io/cluster: prod-kafka }
spec:
  topicName: orders.DLT
  partitions: 3
  replicas: 1
  config: { retention.ms: 1209600000, min.insync.replicas: 2 }