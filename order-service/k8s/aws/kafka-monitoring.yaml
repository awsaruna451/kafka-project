apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-resources-metrics
  namespace: kafka
  labels:
    app: strimzi
    release: kube-prom-stack          # must match Prometheus' podMonitorSelector
spec:
  namespaceSelector:
    matchNames:
      - kafka
  selector:
    matchExpressions:
      - key: strimzi.io/kind
        operator: In
        values: [Kafka, KafkaConnect, KafkaMirrorMaker2]
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(strimzi_io_.+)
          replacement: $1
          separator: ""
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: kubernetes_pod_name
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node_name
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_host_ip]
          targetLabel: node_ip