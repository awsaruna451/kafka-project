apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  kafka:
    {{- with .Values.kafka.version }}
    version: {{ . | quote }}
    {{- end }}
    rack:
      topologyKey: {{ .Values.kafka.rack.topologyKey }}
    listeners:
      {{- toYaml .Values.kafka.listeners | nindent 6 }}
    authorization:
      {{- toYaml .Values.kafka.authorization | nindent 6 }}
    config:
      {{- toYaml .Values.kafka.config | nindent 6 }}
    {{- if .Values.kafka.metrics.enabled }}
    metricsConfig:
      type: strimziMetricsReporter
      values:
        allowList:
          {{- toYaml .Values.kafka.metrics.allowList | nindent 10 }}
    {{- end }}
  entityOperator:
    topicOperator: {}
    userOperator: {}
  {{- if .Values.kafkaExporter.enabled }}
  kafkaExporter:
    topicRegex: {{ .Values.kafkaExporter.topicRegex | quote }}
    groupRegex: {{ .Values.kafkaExporter.groupRegex | quote }}
    resources:
      {{- toYaml .Values.kafkaExporter.resources | nindent 6 }}
  {{- end }}
  {{- if .Values.cruiseControl.enabled }}
  cruiseControl:
    resources:
      {{- toYaml .Values.cruiseControl.resources | nindent 6 }}
  {{- end }}
